name: FIX2 Hygiene

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Reject dangerous fallbacks and silent failures
        run: bash scripts/check-fix2-hygiene.sh

      - name: Apply and validate explicit offscreen routing
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && hashFiles('scripts/apply-offscreen-target-routing-fix.py') != ''
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-offscreen-target-routing-fix.py')
          text = path.read_text(encoding='utf-8')
          old = "    expect(listener(startRequest(), null, vi.fn())).toBe(false)"
          new = """    expect(listener({
              kind: 'START_PLAYBACK',
              requestId: 'request-untargeted',
              source: 'popup-test',
              text: 'Untargeted.',
              settings: { ttsUrl: 'http://localhost:5002/api/tts', voice: 'p225', rate: 1 },
            }, null, vi.fn())).toBe(false)"""
          if text.count(old) != 1:
              raise SystemExit('Untargeted start fixture anchor did not match exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python scripts/apply-offscreen-target-routing-fix.py
          npm ci
          npm run lint
          npm run typecheck
          npx vitest --run src/lib/playback-protocol.test.ts src/offscreen.test.ts src/background/service-worker.test.ts src/fix2-consolidated-state.test.ts src/chromium-block13-contract.test.ts
          git diff --check -- . ':(exclude)*.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Route playback requests through the service worker'
          git push origin HEAD:master
