name: FIX2 Hygiene

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Reject dangerous fallbacks and silent failures
        run: bash scripts/check-fix2-hygiene.sh

      - name: Apply and validate paused-ended race fix
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && hashFiles('scripts/apply-paused-ended-race-fix.py') != ''
        run: |
          set -euo pipefail
          python scripts/apply-paused-ended-race-fix.py
          npm ci
          node --check scripts/chromium-block13-e2e.mjs
          npm run lint
          npm run typecheck
          npx vitest --run src/offscreen/playback-coordinator.test.ts src/chromium-block13-contract.test.ts
          git diff --check -- . ':(exclude)*.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Block completion behind paused audio settlement'
          git push origin HEAD:master
