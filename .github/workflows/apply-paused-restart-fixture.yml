name: Apply Paused Restart Fixture Fix

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-paused-restart-fixture.yml

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Lengthen paused-restart audio fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          matrix = Path('scripts/chromium-block13-e2e.mjs')
          text = matrix.read_text()
          settings = """const DEFAULT_SETTINGS = {\n  voice: 'p225',\n  rate: 1,\n}\n"""
          constants = settings + """const DEFAULT_AUDIO_DURATION_MS = 150\nconst LONG_AUDIO_DURATION_MS = 2_000\nconst RESTART_PAUSED_AUDIO_DURATION_MS = 10_000\n"""
          if settings not in text:
              raise RuntimeError('settings insertion point not found')
          text = text.replace(settings, constants, 1)
          text = text.replace(
              'function makeSilentWav(durationMs = 150, sampleRate = 8_000) {',
              'function makeSilentWav(durationMs = DEFAULT_AUDIO_DURATION_MS, sampleRate = 8_000) {',
              1,
          )
          text = text.replace(
              'function writeAudio(response, durationMs = 150) {',
              'function writeAudio(response, durationMs = DEFAULT_AUDIO_DURATION_MS) {',
              1,
          )
          old_duration = """    const durationMs = (\n      text.includes('BLOCK13_LONG_AUDIO')\n      || text.includes('BLOCK13_RESTART_PLAYBACK')\n      || text.includes('BLOCK13_KEYBOARD_CONTROL')\n    ) ? 2_000 : 150\n"""
          new_duration = """    const durationMs = text.includes('BLOCK13_RESTART_PLAYBACK')\n      ? RESTART_PAUSED_AUDIO_DURATION_MS\n      : (\n          text.includes('BLOCK13_LONG_AUDIO')\n          || text.includes('BLOCK13_KEYBOARD_CONTROL')\n        )\n        ? LONG_AUDIO_DURATION_MS\n        : DEFAULT_AUDIO_DURATION_MS\n"""
          if old_duration not in text:
              raise RuntimeError('duration selection block not found')
          matrix.write_text(text.replace(old_duration, new_duration, 1))

          contract = Path('src/chromium-block13-contract.test.ts')
          text = contract.read_text()
          insertion = """  it('retains fail-closed player and offscreen recovery assertions', () => {\n"""
          test = """  it('gives restart-while-paused a dedicated long-lived audio fixture', () => {\n    const matrix = read('scripts/chromium-block13-e2e.mjs')\n\n    expect(matrix).toContain('const RESTART_PAUSED_AUDIO_DURATION_MS = 10_000')\n    expect(matrix).toContain(\"text.includes('BLOCK13_RESTART_PLAYBACK')\")\n    expect(matrix).toContain('? RESTART_PAUSED_AUDIO_DURATION_MS')\n    expect(matrix).toContain(\"await waitForState(context.cdp, context.page.sessionId, start.sessionId, 'paused')\")\n  })\n\n"""
          if insertion not in text:
              raise RuntimeError('contract insertion point not found')
          contract.write_text(text.replace(insertion, test + insertion, 1))
          PY
          git diff --check

      - name: Validate focused contract
        run: |
          npm ci
          npx vitest --run src/chromium-block13-contract.test.ts
          npm run lint
          npm run typecheck

      - name: Commit fixture fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/chromium-block13-e2e.mjs src/chromium-block13-contract.test.ts
          git commit -m 'Stabilize paused worker restart fixture'
          git push origin HEAD:master
          git rev-parse HEAD > /tmp/fix-sha.txt

      - name: Publish fixture-fix SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request
          repository = os.environ['GITHUB_REPOSITORY']
          sha = pathlib.Path('/tmp/fix-sha.txt').read_text().strip()
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/issues/2/comments',
              data=json.dumps({'body': f'CHROME_READIT_PAUSED_RESTART_FIX sha={sha}'}).encode(),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise RuntimeError(f'unexpected publish response: {response.status}')
          PY
