name: FIX2 One-Shot Coqui Error Classification

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix2-one-shot-coqui-errors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0

      - name: Apply guarded error classification patch
        run: |
          python <<'PY'
          from pathlib import Path

          app_path = Path('docker/coqui-local/app.py')
          text = app_path.read_text()

          marker = """class InvalidVoiceError(ValueError):
              pass
          """
          replacement = """class InvalidVoiceError(ValueError):
              pass


          class BackendNotReadyError(RuntimeError):
              pass
          """
          if 'class BackendNotReadyError' not in text:
              if marker not in text:
                  raise SystemExit('InvalidVoiceError marker not found')
              text = text.replace(marker, replacement, 1)

          old_not_ready = '            raise RuntimeError("TTS backend is not ready")'
          new_not_ready = '            raise BackendNotReadyError("TTS backend is not ready")'
          if new_not_ready not in text:
              if old_not_ready not in text:
                  raise SystemExit('runtime not-ready raise was not found')
              text = text.replace(old_not_ready, new_not_ready, 1)

          old_handler = """        except RuntimeError:
              raise_api_error(503, "NOT_READY", "The TTS model is not ready.")
          """
          new_handler = """        except BackendNotReadyError:
              raise_api_error(503, "NOT_READY", "The TTS model is not ready.")
              raise AssertionError("unreachable")
              
              
          """
          # Add the generic branch without relying on unreachable code in the final text.
          desired_handler = """        except BackendNotReadyError:
              raise_api_error(503, "NOT_READY", "The TTS model is not ready.")
          except Exception:
              LOGGER.exception("Synthesis submission failed")
              raise_api_error(500, "INTERNAL_ERROR", "The TTS service failed unexpectedly.")
          """
          if desired_handler not in text:
              if old_handler not in text:
                  raise SystemExit('endpoint RuntimeError handler was not found')
              text = text.replace(old_handler, desired_handler, 1)

          app_path.write_text(text)

          test_path = Path('docker/coqui-local/tests/test_app.py')
          tests = test_path.read_text()
          test_name = 'def test_executor_submit_failure_is_internal_not_not_ready'
          if test_name not in tests:
              anchor = "\ndef test_host_play_and_debug_endpoints_do_not_exist() -> None:\n"
              if anchor not in tests:
                  raise SystemExit('test insertion anchor was not found')
              test = '''\ndef test_executor_submit_failure_is_internal_not_not_ready() -> None:\n    application = create_app(config=config(), model_loader=lambda _config: FakeTTS())\n\n    with TestClient(application, raise_server_exceptions=False) as client:\n        application.state.runtime._executor = SubmitFailExecutor()\n        response = client.post("/api/tts", json={"text": "Hello", "voice": "p225"})\n        assert response.status_code == 500\n        assert response.json() == {\n            "ok": False,\n            "error": {"code": "INTERNAL_ERROR", "message": "The TTS service failed unexpectedly."},\n        }\n        assert application.state.runtime.metrics().slots_in_use == 0\n\n'''
              tests = tests.replace(anchor, test + anchor, 1)
              test_path.write_text(tests)
          PY

      - name: Validate Coqui service tests
        run: |
          python -m pip install --disable-pip-version-check -r docker/coqui-local/requirements-test.txt
          python -m pytest -q docker/coqui-local/tests

      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix2-one-shot-coqui-errors.yml

      - name: Commit and push safely
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docker/coqui-local/app.py docker/coqui-local/tests/test_app.py .github/workflows/fix2-one-shot-coqui-errors.yml
          git commit -m "Classify Coqui submission failures correctly"
          git pull --rebase origin master
          git push origin HEAD:master
