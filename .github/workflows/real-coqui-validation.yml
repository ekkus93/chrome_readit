name: Real Coqui Validation

on:
  workflow_dispatch:
    inputs:
      ready_timeout_seconds:
        description: Maximum model startup wait
        required: false
        default: '1200'
        type: string
  push:
    branches: [master]
    paths:
      - docs/CHROME_READIT_FIX2_REAL_COQUI_VALIDATION_REQUEST.md

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: real-coqui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-coqui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Record environment
        run: |
          set -euo pipefail
          mkdir -p reports/real-coqui
          {
            echo "sha=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            docker --version
            docker compose version
            df -h
          } | tee reports/real-coqui/environment.txt

      - name: Run real model validation
        env:
          REAL_COQUI_READY_TIMEOUT_SECONDS: ${{ inputs.ready_timeout_seconds || '1200' }}
          REAL_COQUI_ARTIFACT_DIR: ${{ github.workspace }}/reports/real-coqui
        run: bash scripts/validate-real-coqui.sh

      - name: Record image and volume metadata
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p reports/real-coqui
          image_id="$(docker compose -f docker/docker-compose.yml images -q coqui-local)"
          if [[ -n "${image_id}" ]]; then
            docker image inspect "${image_id}" \
              > reports/real-coqui/image-inspect.json 2>/dev/null || true
          fi
          docker volume ls --format json \
            > reports/real-coqui/volumes.json 2>/dev/null || true
          docker compose -f docker/docker-compose.yml logs --no-color coqui-local \
            > reports/real-coqui/final-container.log 2>&1 || true

      - name: Upload real Coqui evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-coqui-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/real-coqui
          if-no-files-found: error
          retention-days: 14

      - name: Publish real Coqui status issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STATUS_ISSUE: '3'
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          import os
          import subprocess
          import time
          from datetime import datetime, timezone

          repo = os.environ['GITHUB_REPOSITORY']
          run_id = int(os.environ['GITHUB_RUN_ID'])
          attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
          sha = os.environ['GITHUB_SHA']
          conclusion = os.environ['JOB_STATUS']
          issue_number = int(os.environ['STATUS_ISSUE'])
          artifact_name = f'real-coqui-{run_id}-{attempt}'
          artifact = None

          for _ in range(6):
              raw = subprocess.run(
                  ['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'],
                  check=True,
                  text=True,
                  capture_output=True,
              )
              payload = json.loads(raw.stdout)
              artifact = next(
                  (item for item in payload.get('artifacts', []) if item.get('name') == artifact_name),
                  None,
              )
              if artifact is not None:
                  break
              time.sleep(2)

          artifact_id = artifact.get('id') if isinstance(artifact, dict) else None
          artifact_digest = artifact.get('digest') if isinstance(artifact, dict) else None
          artifact_size = artifact.get('size_in_bytes') if isinstance(artifact, dict) else None
          observed = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          body = '\n'.join([
              '<!-- maintained by .github/workflows/real-coqui-validation.yml -->',
              '# Latest Real Coqui Validation',
              '',
              f'- **Status:** `completed`',
              f'- **Conclusion:** `{conclusion}`',
              f'- **Run:** `{run_id}`',
              f'- **Attempt:** `{attempt}`',
              f'- **Commit:** `{sha}`',
              f'- **Artifact:** `{artifact_name}`',
              f'- **Artifact ID:** `{artifact_id if artifact_id is not None else "pending"}`',
              f'- **Artifact digest:** `{artifact_digest if artifact_digest is not None else "pending"}`',
              f'- **Artifact bytes:** `{artifact_size if artifact_size is not None else "pending"}`',
              f'- **Observed:** `{observed}`',
              '',
              '## Machine-readable status',
              '',
              '```json',
              json.dumps({
                  'schema_version': 1,
                  'workflow': {
                      'name': 'Real Coqui Validation',
                      'run_id': run_id,
                      'run_attempt': attempt,
                      'head_sha': sha,
                      'conclusion': conclusion,
                      'run_url': f'https://github.com/{repo}/actions/runs/{run_id}',
                  },
                  'artifact': {
                      'name': artifact_name,
                      'id': artifact_id,
                      'digest': artifact_digest,
                      'size_in_bytes': artifact_size,
                  },
              }, indent=2, sort_keys=True),
              '```',
              '',
              'This issue is overwritten by the durable real-model validation workflow. It is not a historical log.',
              '',
          ])

          issue = json.loads(subprocess.run(
              ['gh', 'api', f'repos/{repo}/issues/{issue_number}'],
              check=True,
              text=True,
              capture_output=True,
          ).stdout)
          marker = '<!-- maintained by .github/workflows/real-coqui-validation.yml -->'
          if not isinstance(issue.get('body'), str) or not issue['body'].startswith(marker):
              raise SystemExit('Runtime status issue ownership marker is missing.')

          patch_path = os.path.join(os.environ['RUNNER_TEMP'], 'real-coqui-status.json')
          with open(patch_path, 'w', encoding='utf-8') as handle:
              json.dump({'body': body}, handle)
          subprocess.run([
              'gh', 'api', '--method', 'PATCH',
              f'repos/{repo}/issues/{issue_number}',
              '--input', patch_path,
          ], check=True)
          PY
