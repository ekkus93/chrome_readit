name: Run Coverage Documentation Reconciliation
# retrigger: 2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/run-coverage-reconcile.yml

permissions:
  contents: write
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Extract and run checked-in reconciliation
        run: |
          set -euo pipefail
          python - <<'RUNNER'
          from pathlib import Path

          lines = Path('.github/workflows/reconcile-coverage-docs.yml').read_text().splitlines()
          start = lines.index("          python - <<'PY'") + 1
          end = lines.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'
          Path('/tmp/reconcile-coverage-docs.py').write_text(script)
          RUNNER
          python /tmp/reconcile-coverage-docs.py
          sed -i 's/^          //' README.md docker/coqui-local/README.md docs/CHROME_READIT_FIX2_EVIDENCE_INDEX_2026-08-02.md docs/CHROME_READIT_TEST_COVERAGE_HARDENING_TODO_2026-08-03.md docs/CHROME_READIT_TEST_COVERAGE_HARDENING_IMPLEMENTATION_REPORT_2026-08-03.md
          git diff --check

      - name: Commit reconciled documentation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docker/coqui-local/README.md docs/CHROME_READIT_FIX2_EVIDENCE_INDEX_2026-08-02.md docs/CHROME_READIT_TEST_COVERAGE_HARDENING_TODO_2026-08-03.md docs/CHROME_READIT_TEST_COVERAGE_HARDENING_IMPLEMENTATION_REPORT_2026-08-03.md
          git commit -m 'Reconcile coverage hardening evidence'
          git push origin HEAD:master
          git rev-parse HEAD > /tmp/reconciled-sha.txt

      - name: Publish reconciled SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          sha = pathlib.Path('/tmp/reconciled-sha.txt').read_text().strip()
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/issues/2/comments',
              data=json.dumps({'body': f'CHROME_READIT_COVERAGE_RECONCILED sha={sha}'}).encode(),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise RuntimeError(f'unexpected publish response: {response.status}')
          PY
