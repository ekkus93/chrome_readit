name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Reconcile final offscreen-routing evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && hashFiles('scripts/reconcile-offscreen-routing-final-evidence.py') != ''
        run: |
          set -euo pipefail
          python scripts/reconcile-offscreen-routing-final-evidence.py
          git diff --check -- . ':(exclude)*.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile final offscreen routing evidence'
          git push origin HEAD:master

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install extension dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify TypeScript coverage surface
        run: node scripts/check-coverage-surface.mjs

      - name: Run FIX2 hygiene checks
        run: bash scripts/check-fix2-hygiene.sh

      - name: Scan full Git history for secret patterns
        run: bash scripts/check-secret-patterns.sh

      - name: Validate release script syntax
        run: |
          set -euo pipefail
          bash -n scripts/check-fix2-hygiene.sh
          bash -n scripts/check-secret-patterns.sh
          bash -n scripts/validate-real-coqui.sh
          python -m py_compile scripts/publish-real-coqui-status.py scripts/check_python_coverage.py
          node --check scripts/check-coverage-surface.mjs
          node --check scripts/check-coverage-thresholds.mjs
          node --check scripts/coverage-policy.mjs

      - name: Run extension tests with coverage
        run: |
          set -euo pipefail
          mkdir -p reports
          npx vitest --run --coverage \
            --coverage.thresholds.lines=85 \
            --coverage.thresholds.functions=85 \
            --coverage.thresholds.statements=85 \
            --coverage.thresholds.branches=75 \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=reports/vitest-junit.xml
          node scripts/check-coverage-thresholds.mjs

      - name: Upload Vitest JUnit report
        if: ${{ always() && hashFiles('reports/vitest-junit.xml') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vitest-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/vitest-junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload TypeScript coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typescript-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/coverage-final.json
            coverage/index.html
            coverage/assets
            reports/typescript-coverage-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Build extension
        run: npm run build

      - name: Validate extension manifest and assets
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const manifestPath = 'dist/manifest.json'
          if (!fs.existsSync(manifestPath)) throw new Error('dist/manifest.json is missing')
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
          if (!manifest.background?.service_worker) throw new Error('background service worker missing')
          if (!manifest.action?.default_popup) throw new Error('popup entry missing')
          if (!manifest.options_page && !manifest.options_ui?.page) throw new Error('options entry missing')
          if (!manifest.minimum_chrome_version) throw new Error('minimum_chrome_version is missing')
          const requiredHtml = ['src/offscreen.html']
          for (const html of requiredHtml) {
            if (!fs.existsSync(path.join('dist', html))) throw new Error(`${html} missing from dist`)
          }
          const assets = [...new Set([
            ...Object.values(manifest.icons || {}),
            ...(manifest.web_accessible_resources || []).flatMap((entry) =>
              typeof entry === 'string' ? [entry] : (entry.resources || [])),
          ])]
          for (const asset of assets) {
            if (asset.includes('*')) continue
            if (!fs.existsSync(path.join('dist', asset))) throw new Error(`${asset} missing from dist`)
          }
          NODE

      - name: Build diagnostic extension bundle
        run: npm run build:e2e

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd
        with:
          chrome-version: stable

      - name: Run real Chromium extension tests
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          mkdir -p reports
          xvfb-run -a npm run test:chromium 2>&1 | tee reports/chromium-e2e.log
          xvfb-run -a npm run test:chromium-ui 2>&1 | tee -a reports/chromium-e2e.log

      - name: Upload Chromium diagnostic log
        if: ${{ always() && hashFiles('reports/chromium-e2e.log') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chromium-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/chromium-e2e.log
          if-no-files-found: error
          retention-days: 14

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docker/coqui-local/requirements-test.txt

      - name: Install Coqui service test dependencies
        run: python -m pip install --disable-pip-version-check -r docker/coqui-local/requirements-test.txt

      - name: Run Coqui service tests with branch coverage
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m pytest --version
          python -m coverage --version
          python -c "import pytest_cov; print('pytest-cov', pytest_cov.__version__)"
          python -m pytest -q docker/coqui-local/tests \
            --cov=docker/coqui-local \
            --cov-config=.coveragerc \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:reports/coqui-coverage.xml \
            --cov-report=json:reports/coqui-coverage.json \
            --junitxml=reports/coqui-junit.xml
          python scripts/check_python_coverage.py

      - name: Upload Python coverage evidence
        if: ${{ always() && hashFiles('reports/coqui-coverage.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/coqui-coverage.xml
            reports/coqui-coverage.json
            reports/coqui-junit.xml
          if-no-files-found: error
          retention-days: 14

      - name: Publish coverage summary
        env:
          CI_HEAD_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          ts = json.loads(Path('reports/typescript-coverage-summary.json').read_text())
          py = json.loads(Path('reports/coqui-coverage.json').read_text())
          lines = [
              '# Coverage evidence',
              '',
              f"- Head SHA: `{os.environ['CI_HEAD_SHA']}`",
              f"- Run: `{os.environ['CI_RUN_ID']}`",
              f"- Attempt: `{os.environ['CI_RUN_ATTEMPT']}`",
              f"- TypeScript statements: `{ts['global']['statements']['pct']:.2f}%`",
              f"- TypeScript branches: `{ts['global']['branches']['pct']:.2f}%`",
              f"- TypeScript functions: `{ts['global']['functions']['pct']:.2f}%`",
              f"- TypeScript lines: `{ts['global']['lines']['pct']:.2f}%`",
              f"- Python statements: `{py['totals']['percent_statements_covered']:.2f}%`",
              f"- Python branches: `{py['totals']['percent_branches_covered']:.2f}%`",
              '- Critical TypeScript files: `passed`',
              '- Coverage policy: `passed`',
              '',
          ]
          text = '\n'.join(lines)
          print(text)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write(text)
          PY

      - name: Validate Compose security defaults
        run: |
          set -euo pipefail
          docker compose -f docker/docker-compose.yml config > /tmp/chrome-readit-compose.yml
          grep -q 'host_ip: 127.0.0.1' /tmp/chrome-readit-compose.yml
          grep -q 'source: coqui_models' /tmp/chrome-readit-compose.yml
          grep -q 'target: /home/readit/.local/share/tts' /tmp/chrome-readit-compose.yml

      - name: Upload TypeScript coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: coverage/coverage-final.json
          flags: typescript-unit
          fail_ci_if_error: true
          verbose: true

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: reports/coqui-coverage.xml
          flags: python-coqui
          fail_ci_if_error: true
          verbose: true
