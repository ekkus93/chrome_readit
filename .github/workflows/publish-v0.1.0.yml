name: Publish v0.1.0

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-v0.1.0.yml

permissions:
  contents: write

concurrency:
  group: publish-v0.1.0
  cancel-in-progress: false

jobs:
  validate-tag-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: 63e00203c490aaf135c1457cfd8904eff75d4b92
      RELEASE_TAG: v0.1.0
    steps:
      - name: Checkout clean release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 63e00203c490aaf135c1457cfd8904eff75d4b92
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install extension dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck

      - name: Verify repository policy
        run: |
          set -euo pipefail
          node scripts/check-coverage-surface.mjs
          bash scripts/check-fix2-hygiene.sh
          bash scripts/check-secret-patterns.sh
          bash -n scripts/package-tagged-release.sh

      - name: Run extension tests with coverage
        run: |
          set -euo pipefail
          npx vitest --run --coverage \
            --coverage.thresholds.lines=85 \
            --coverage.thresholds.functions=85 \
            --coverage.thresholds.statements=85 \
            --coverage.thresholds.branches=75
          node scripts/check-coverage-thresholds.mjs

      - name: Build and validate production extension
        run: |
          set -euo pipefail
          npm run build
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const manifestPath = 'dist/manifest.json'
          if (!fs.existsSync(manifestPath)) throw new Error('dist/manifest.json is missing')
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
          if (manifest.version !== '0.1.0') throw new Error(`unexpected manifest version ${manifest.version}`)
          if (!manifest.background?.service_worker) throw new Error('background service worker missing')
          if (!manifest.action?.default_popup) throw new Error('popup entry missing')
          if (!manifest.options_page && !manifest.options_ui?.page) throw new Error('options entry missing')
          if (!manifest.minimum_chrome_version) throw new Error('minimum_chrome_version is missing')
          for (const html of ['src/offscreen.html']) {
            if (!fs.existsSync(path.join('dist', html))) throw new Error(`${html} missing from dist`)
          }
          NODE

      - name: Build diagnostic extension bundle
        run: npm run build:e2e

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd
        with:
          chrome-version: stable

      - name: Run Chromium extension tests
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          xvfb-run -a npm run test:chromium
          xvfb-run -a npm run test:chromium-ui

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docker/coqui-local/requirements-test.txt

      - name: Run Coqui service tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r docker/coqui-local/requirements-test.txt
          mkdir -p reports
          python -m pytest -q docker/coqui-local/tests \
            --cov=docker/coqui-local \
            --cov-config=.coveragerc \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:reports/coqui-coverage.json
          python scripts/check_python_coverage.py

      - name: Validate Compose defaults
        run: |
          set -euo pipefail
          docker compose -f docker/docker-compose.yml config > /tmp/chrome-readit-compose.yml
          grep -q 'host_ip: 127.0.0.1' /tmp/chrome-readit-compose.yml
          grep -q 'source: coqui_models' /tmp/chrome-readit-compose.yml
          grep -q 'target: /home/readit/.local/share/tts' /tmp/chrome-readit-compose.yml

      - name: Rebuild and package release assets
        run: |
          set -euo pipefail
          npm run build
          bash scripts/package-tagged-release.sh "${RELEASE_TAG}" release

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
            if [[ "${existing_sha}" != "${RELEASE_SHA}" ]]; then
              echo "${RELEASE_TAG} already points to ${existing_sha}, expected ${RELEASE_SHA}." >&2
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${RELEASE_SHA}"
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "${RELEASE_TAG}"
          fi

      - name: Remove one-shot publisher
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B master origin/master
          rm .github/workflows/publish-v0.1.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/publish-v0.1.0.yml
          git commit -m 'Remove one-shot v0.1.0 publisher'
          git push origin HEAD:master
