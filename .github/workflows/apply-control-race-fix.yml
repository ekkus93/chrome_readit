name: Apply Playback Control Race Fix

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-control-race-fix.yml

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply verified race-fix archive
        env:
          EXPECTED_SHA256: f3918b4f1d52920bc288f3aa82e31fe7069fab7b14441422ddd21ccb8370d357
        run: |
          set -euo pipefail
          cat > /tmp/control-race-fix.b64 <<'EOF'

EOF
          base64 -d /tmp/control-race-fix.b64 > /tmp/control-race-fix.tar.gz
          echo "${EXPECTED_SHA256}  /tmp/control-race-fix.tar.gz" | sha256sum -c -
          tar -xzf /tmp/control-race-fix.tar.gz
          git diff --check

      - name: Commit non-workflow changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/options/Options.tsx \
            src/popup/Popup.tsx \
            src/options/Options.ui.test.tsx \
            src/popup/Popup.ui.test.tsx \
            src/options/Options.test-speech.int.test.tsx \
            src/popup/Popup.test-speech.test.tsx
          git commit -m 'Fix stale playback control session race'
          git push origin HEAD:master
          git rev-parse HEAD > /tmp/fix-sha.txt

      - name: Publish candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request
          repository = os.environ['GITHUB_REPOSITORY']
          sha = pathlib.Path('/tmp/fix-sha.txt').read_text().strip()
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/issues/2/comments',
              data=json.dumps({'body': f'CHROME_READIT_CONTROL_RACE_FIX sha={sha}'}).encode(),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise RuntimeError(f'unexpected publish response: {response.status}')
          PY
