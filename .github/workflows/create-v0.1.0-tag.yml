name: Create v0.1.0 Tag

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/create-v0.1.0-tag.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: create-v0.1.0-tag
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Create clean release commit
        id: release
        run: |
          set -euo pipefail

          if git show-ref --verify --quiet refs/tags/v0.1.0; then
            echo 'Tag v0.1.0 already exists.' >&2
            exit 1
          fi

          npm version 0.1.0 --no-git-tag-version

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/manifest.ts')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r"(?m)^(\s*version:\s*)'[^']+'(,\s*)$",
              r"\g<1>'0.1.0'\g<2>",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one manifest version field, replaced {count}.')
          path.write_text(updated, encoding='utf-8')
          PY

          rm .github/workflows/create-v0.1.0-tag.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/manifest.ts .github/workflows/create-v0.1.0-tag.yml
          git diff --cached --check
          git commit -m 'Release v0.1.0'

          release_sha="$(git rev-parse HEAD)"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          git push origin HEAD:master

      - name: Wait for CI on release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 180); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&event=push&per_page=10")"
            result="$(python -c 'import json,sys; data=json.load(sys.stdin); runs=data.get("workflow_runs", []); run=next((item for item in runs if item.get("head_sha")==sys.argv[1]), None); print("missing" if run is None else f"{run.get(chr(115)+chr(116)+chr(97)+chr(116)+chr(117)+chr(115))}:{run.get(chr(99)+chr(111)+chr(110)+chr(99)+chr(108)+chr(117)+chr(115)+chr(105)+chr(111)+chr(110))}")' "${RELEASE_SHA}" <<<"${payload}")"

            case "${result}" in
              completed:success)
                exit 0
                ;;
              completed:*)
                echo "CI failed for ${RELEASE_SHA}: ${result}" >&2
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Timed out waiting for CI on ${RELEASE_SHA}." >&2
          exit 1

      - name: Create v0.1.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref='refs/tags/v0.1.0' \
            -f sha="${RELEASE_SHA}"
