name: Temporary Source Export

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/export-source.yml

permissions:
  contents: read
  issues: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Package repository source
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=coverage --exclude=dist \
            -czf /tmp/chrome-readit-source-${GITHUB_SHA}.tar.gz .

      - name: Upload source artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrome-readit-source-${{ github.sha }}
          path: /tmp/chrome-readit-source-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Publish export coordinates
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['GITHUB_RUN_ID']
          sha = os.environ['GITHUB_SHA']
          artifact_id = os.environ['ARTIFACT_ID']
          body = f'CHROME_READIT_SOURCE_EXPORT sha={sha} run={run_id} artifact={artifact_id}'
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/issues/2/comments',
              data=json.dumps({'body': body}).encode(),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise RuntimeError(f'Unexpected GitHub response: {response.status}')
          PY
