name: FIX2 One-Shot Street Segmentation Patch V2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix2-one-shot-street-segmentation-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0

      - name: Apply idempotent guarded patch
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/lib/text-segmentation.ts')
          text = path.read_text()
          old = """  if (!prefix) return true
            if (/(?:^|\\s)(?:to|in|at|from|near|toward|towards|visit|visited)$/i.test(prefix)) return true
            return isLowercaseLetter(nextCharacter)
              && /(?:^|\\s)\\d+[\\p{L}\\d.'’-]*(?:\\s+[\\p{L}\\d.'’-]+)*$/u.test(prefix)
          """
          new = """  if (!prefix) return true
            if (isLowercaseLetter(nextCharacter)) return true
            return /(?:^|\\s)(?:to|in|at|from|near|toward|towards|visit|visited)$/i.test(prefix)
          """
          if new in text:
              print('street continuation patch already present')
          elif old in text:
              path.write_text(text.replace(old, new, 1))
          else:
              raise SystemExit('unrecognized shouldContinueAfterSt implementation')
          PY

      - name: Validate focused gates
        run: |
          npm ci
          npx vitest --run src/lib/text-segmentation.test.ts src/lib/chunk-packing.test.ts
          npm run lint
          npm run typecheck

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/fix2-one-shot-street-segmentation.yml
          rm -f .github/workflows/fix2-one-shot-street-segmentation-v2.yml

      - name: Commit and push safely
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/text-segmentation.ts .github/workflows/fix2-one-shot-street-segmentation.yml .github/workflows/fix2-one-shot-street-segmentation-v2.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix lowercase street abbreviation continuation"
          git pull --rebase origin master
          git push origin HEAD:master

