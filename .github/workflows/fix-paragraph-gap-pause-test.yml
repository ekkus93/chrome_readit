name: Repair Paragraph Gap Pause Test

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-paragraph-gap-pause-test.yml

permissions:
  contents: write

concurrency:
  group: repair-paragraph-gap-pause-test
  cancel-in-progress: false

jobs:
  patch-test-validate-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Patch stale pause-gap timing contract
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('scripts/chromium-block13-e2e.mjs')
          text = path.read_text()

          old_rate = """async function verifyPausePreservesGap(context) {
            await setSettings(context.cdp, context.page.sessionId, { ...context.settings, rate: 1 })"""
          new_rate = """async function verifyPausePreservesGap(context) {
            await setSettings(context.cdp, context.page.sessionId, { ...context.settings, rate: 0.5 })"""
          if text.count(old_rate) != 1:
              raise SystemExit(f'expected one pause-gap rate contract, found {text.count(old_rate)}')
          text = text.replace(old_rate, new_rate, 1)

          old_tail = """  await waitForState(context.cdp, context.page.sessionId, start.sessionId, 'completed')
          }

          async function verifyOffscreenDestruction(context)"""
          new_tail = """  await waitForState(context.cdp, context.page.sessionId, start.sessionId, 'completed')
            await setSettings(context.cdp, context.page.sessionId, context.settings)
          }

          async function verifyOffscreenDestruction(context)"""
          if text.count(old_tail) != 1:
              raise SystemExit(f'expected one pause-gap function tail, found {text.count(old_tail)}')
          text = text.replace(old_tail, new_tail, 1)
          path.write_text(text)
          PY
          rm .github/workflows/fix-paragraph-gap-pause-test.yml

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and repository policy
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          node scripts/check-coverage-surface.mjs
          bash scripts/check-fix2-hygiene.sh
          bash scripts/check-secret-patterns.sh
          bash -n scripts/package-tagged-release.sh

      - name: Run extension tests with coverage
        run: |
          set -euo pipefail
          mkdir -p reports
          npx vitest --run --coverage \
            --coverage.thresholds.lines=85 \
            --coverage.thresholds.functions=85 \
            --coverage.thresholds.statements=85 \
            --coverage.thresholds.branches=75
          node scripts/check-coverage-thresholds.mjs

      - name: Build extension bundles
        run: |
          set -euo pipefail
          npm run build
          npm run build:e2e

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd
        with:
          chrome-version: stable

      - name: Run real Chromium tests
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          xvfb-run -a npm run test:chromium
          xvfb-run -a npm run test:chromium-ui

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docker/coqui-local/requirements-test.txt

      - name: Run Coqui tests and Compose validation
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r docker/coqui-local/requirements-test.txt
          mkdir -p reports
          python -m pytest -q docker/coqui-local/tests \
            --cov=docker/coqui-local \
            --cov-config=.coveragerc \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:reports/coqui-coverage.json
          python scripts/check_python_coverage.py
          docker compose -f docker/docker-compose.yml config > /tmp/chrome-readit-compose.yml
          grep -q 'host_ip: 127.0.0.1' /tmp/chrome-readit-compose.yml

      - name: Commit validated repair and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/chromium-block13-e2e.mjs .github/workflows/fix-paragraph-gap-pause-test.yml
          git commit -m 'Align pause-gap test with compact paragraph timing'
          git push origin HEAD:master
