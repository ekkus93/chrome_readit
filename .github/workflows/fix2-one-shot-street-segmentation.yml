name: FIX2 One-Shot Street Segmentation Patch

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix2-one-shot-street-segmentation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master

      - name: Apply guarded segmentation patch
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/lib/text-segmentation.ts')
          text = path.read_text()
          old = """  if (!prefix) return true
            if (/(?:^|\\s)(?:to|in|at|from|near|toward|towards|visit|visited)$/i.test(prefix)) return true
            return isLowercaseLetter(nextCharacter)
              && /(?:^|\\s)\\d+[\\p{L}\\d.'’-]*(?:\\s+[\\p{L}\\d.'’-]+)*$/u.test(prefix)
          """
          new = """  if (!prefix) return true
            if (isLowercaseLetter(nextCharacter)) return true
            return /(?:^|\\s)(?:to|in|at|from|near|toward|towards|visit|visited)$/i.test(prefix)
          """
          if old not in text:
              raise SystemExit('expected shouldContinueAfterSt block was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate focused segmentation tests
        run: |
          npm ci
          npx vitest --run src/lib/text-segmentation.test.ts src/lib/chunk-packing.test.ts
          npm run lint
          npm run typecheck

      - name: Remove one-shot workflow
        run: rm .github/workflows/fix2-one-shot-street-segmentation.yml

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/text-segmentation.ts .github/workflows/fix2-one-shot-street-segmentation.yml
          git commit -m "Fix lowercase street abbreviation continuation"
          git push origin HEAD:master
